services:
  desktop:
    build:
      context: .
      args:
        CODDY_REF: "2ba0ec9cc531e31954c2565b2984d92d4bc890d3"
    image: relay-ai-desktop:local
    init: true
    ports:
      - "127.0.0.1:3000:8080"
    shm_size: "1gb"
    # Chromium/Electron create nested sandbox namespaces that Docker's default
    # seccomp profile blocks.
    security_opt:
      - seccomp=unconfined
    cap_drop:
      - AUDIT_WRITE
      - MKNOD
      - NET_RAW
    environment:
      WIDTH: "1440"
      HEIGHT: "900"
      RESTORE_INSTALLS: "true"
      # Deterministic fixtures for the loopback-only community setup.
      VNC_PASSWORD: "${VNC_PASSWORD:-testtest}"
      CONTROL_TOKEN: "${CONTROL_TOKEN:-test-control-token}"
      CODDY_BASE_URL: "http://127.0.0.1:12345"
      CODDY_HTTP_TOKEN: "${CODDY_HTTP_TOKEN:-test-coddy-http-token-change-me}"
      RELAY_BASE_URL: "http://127.0.0.1:8080"
      RELAY_OPERATOR_TOKEN: "${CONTROL_TOKEN:-test-control-token}"
      RELAY_AGENT_ID: "coddy-agent"
      RELAY_STREAMING: "${RELAY_STREAMING:-vnc}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o}"
    volumes:
      - desktop-home:/home/desktop
      - desktop-state:/var/lib/relay
      - coddy-state:/var/lib/coddy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/relay/scripts/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  desktop-home:
  desktop-state:
  coddy-state:
