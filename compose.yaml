services:
  desktop:
    build:
      context: .
    image: virtual-desktop:local
    init: true
    ports:
      - "127.0.0.1:3000:8080"
    shm_size: "1gb"
    # Chromium/Electron create nested sandbox namespaces. Docker's default seccomp
    # profile blocks those syscalls; see docs/SECURITY.md before changing exposure.
    security_opt:
      - seccomp=unconfined
    cap_drop:
      - AUDIT_WRITE
      - MKNOD
      - NET_RAW
    environment:
      WIDTH: "1440"
      HEIGHT: "900"
      RESTORE_INSTALLS: "true"
      # Deterministic loopback-only development fixtures. Override both before
      # exposing Relay beyond this local Compose setup.
      VNC_PASSWORD: "${VNC_PASSWORD:-testtest}"
      CONTROL_TOKEN: "${CONTROL_TOKEN:-test-control-token}"
    volumes:
      - desktop-home:/home/desktop
      - desktop-state:/var/lib/relay
    restart: unless-stopped

volumes:
  desktop-home:
  desktop-state:
