worker_processes 1;
pid @@PID_FILE@@;
error_log @@LOG_DIR@@/nginx.error.log warn;
daemon off;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log @@LOG_DIR@@/nginx.access.log;
  server_tokens off;
  client_body_temp_path @@LOG_DIR@@/nginx-body;
  proxy_temp_path @@LOG_DIR@@/nginx-proxy;
  fastcgi_temp_path @@LOG_DIR@@/nginx-fastcgi;
  uwsgi_temp_path @@LOG_DIR@@/nginx-uwsgi;
  scgi_temp_path @@LOG_DIR@@/nginx-scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen @@LISTEN@@;
    server_name _;
    client_max_body_size 64k;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;

    location /api/ {
      proxy_pass http://127.0.0.1:@@CONTROL_PORT@@;
      proxy_http_version 1.1;
      proxy_read_timeout 920s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /metrics {
      proxy_pass http://127.0.0.1:@@CONTROL_PORT@@;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /websockify {
      proxy_pass http://127.0.0.1:@@WEBSOCKIFY_PORT@@;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }

    location /novnc/ {
      alias @@NOVNC_ROOT@@/;
      expires 1h;
    }

    location ~ \.mjs$ {
      root @@WEB_ROOT@@;
      default_type application/javascript;
      try_files $uri =404;
    }

    location / {
      root @@WEB_ROOT@@;
      try_files $uri $uri/ /index.html;
    }
  }
}
