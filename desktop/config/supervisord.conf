[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:dbus]
command=/usr/bin/dbus-daemon --session --nofork --address=unix:path=/run/user/1000/bus
user=desktop
environment=HOME="/home/desktop",USER="desktop",LOGNAME="desktop"
priority=5
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:installer]
command=/usr/bin/python3 /opt/relay/broker/install_broker.py --group relayapi
user=root
priority=5
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_WIDTH)sx%(ENV_HEIGHT)sx24 -dpi 96 -nolisten tcp -ac +extension RANDR
user=desktop
environment=HOME="/home/desktop",USER="desktop",LOGNAME="desktop"
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:desktop]
command=/opt/relay/scripts/start-desktop.sh
user=desktop
environment=HOME="/home/desktop",USER="desktop",LOGNAME="desktop"
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/opt/relay/scripts/wait-for-x.sh /usr/bin/x11vnc -display :0 -rfbauth /run/relay-vnc/vnc.pass -rfbport 5900 -localhost -forever -shared -repeat -wait 10 -defer 10 -nocursorshape -cursor most
user=desktop
environment=HOME="/home/desktop",USER="desktop",LOGNAME="desktop"
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:websockify]
command=/usr/bin/websockify 127.0.0.1:6080 127.0.0.1:5900
user=desktop
environment=HOME="/home/desktop",USER="desktop",LOGNAME="desktop"
priority=35
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:accessibility-adapter]
command=/usr/bin/python3 /opt/relay/control/a11y_service.py
directory=/opt/relay/control
user=desktop
environment=HOME="/home/desktop",USER="desktop",LOGNAME="desktop"
priority=38
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:control-api]
command=/usr/bin/python3 -m control.api
directory=/opt/relay
environment=PYTHONPATH="/opt/relay",HOME="/tmp",USER="relayapi",LOGNAME="relayapi"
user=relayapi
priority=40
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
priority=50
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
