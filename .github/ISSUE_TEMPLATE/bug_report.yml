name: Bug report
description: Report a reproducible problem with the desktop, stream, control API, or web UI.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the private guidance in `.github/SECURITY.md`.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest reliable sequence, starting from Docker Compose.
      placeholder: |
        1. Run docker compose up -d --build
        2. Open http://127.0.0.1:3000
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Desktop or application
        - Streaming or connection
        - Human/AI control handoff
        - AI input or grounding
        - Runtime installation
        - Persistence
        - Documentation or tests
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS, architecture, Docker/Compose versions, and browser.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Add sanitized logs, screenshots, or failing test output. Remove all credentials and tokens.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, cookies, and private data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
